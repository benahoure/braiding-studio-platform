name: Deploy Infra — Apply

# Step 2 of 2. Takes the run ID of a completed "Deploy Infra — Plan" run,
# downloads that exact plan + the Lambda zips it was computed against, and
# applies it verbatim. Always a separate, deliberate dispatch from Plan — it
# never auto-chains, so applying infra changes is always its own click.
on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Target environment"
        required: true
        default: dev
        type: choice
        options: [dev, prod]
      plan_run_id:
        description: "Run ID of the Deploy Infra — Plan run to apply (from that run's summary)"
        required: true
        type: string

env:
  AWS_REGION: us-east-1
  TF_VERSION: "1.14.1"
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  apply:
    name: Apply (${{ inputs.environment }})
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment == 'prod' && 'production' || 'development' }}
    permissions:
      id-token: write
      contents: read
      actions: read # required to fetch an artifact from a different workflow run
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ env.AWS_REGION }}

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Terraform Init
        working-directory: infra
        run: terraform init -backend-config=backend/${{ inputs.environment }}.tfbackend -reconfigure

      # Downloads the exact plan file AND the exact Lambda zips from the Plan
      # run — nothing is rebuilt here, so what applies is byte-for-byte what
      # was reviewed.
      - name: Download plan + Lambda artifacts
        uses: actions/download-artifact@v4
        with:
          name: tfplan-${{ inputs.environment }}-${{ inputs.plan_run_id }}
          path: .
          run-id: ${{ inputs.plan_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Terraform Apply
        working-directory: infra
        run: terraform apply tfplan

      - name: Flush Lambda SSM cache
        run: |
          for fn in \
            braidsbydeb-${{ inputs.environment }}-public-api \
            braidsbydeb-${{ inputs.environment }}-admin-api; do
            aws lambda update-function-configuration \
              --function-name "$fn" \
              --description "cache-flush-${{ github.run_id }}" \
              --no-cli-pager || true
          done
